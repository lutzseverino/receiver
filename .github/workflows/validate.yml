name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ${{ vars.REPO_CANON_RUNS_ON && fromJSON(vars.REPO_CANON_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global pnpm@11.28.10
      - run: pnpm install --frozen-lockfile
      # the browser tests drive the runner's Chrome; the build reads the
      # projects from the committed fixture, so no pull request's checks
      # depend on other repositories' live state
      - run: pnpm validate
        env:
          SITE_PROJECTS: fixture
