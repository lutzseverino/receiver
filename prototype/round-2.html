<!doctype html>
<!--
  PROTOTYPE — throwaway, round 2. Round 1 (all five variants) is in round-1.html; the owner picked D,
  the full-screen dot-matrix receiver. Question now: "What should the cover panel in front of the
  display, and the intro, look like?"
  Variants (?variant=, or the bottom bar / ← →):
    acrylic  smoked acrylic cover: wiping scratches, swirls, a fingerprint, streetlight reflections;
             "ignition" intro: filaments glow orange, self-test, LW 171 kHz, the name scans in, radiotext crawl.
    glass    glass in a bezel, with chipped edges and a specular streak; parallax against the dots;
             "band scan" intro: the screen becomes a spectrum and each channel rises as a peak.
    worn     scuffed, hazy plastic; parallax; "bleed-through" intro: tuning through static,
             fragments of other channels bleed in, then the station ID resolves out of the noise.
    base     round 1's D exactly as picked, for comparison.
  Mix any panel with any intro: ?panel=none|acrylic|glass|worn&intro=classic|ignition|scan|bleed&bezel=1&parallax=1
  Scratches catch the display's own light: they show where the dots behind them are lit.
  The intro plays on every load; a deep link (#blog/...) gets only a short power-on.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · receiver · round 2</title>
<style>
  :root {
    --phosphor: #e6fbff;
    --glow: 120, 220, 255;
    --ink: #d9dee2;
    --dim: #7c868d;
    --bg: #050607;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; }
  a { color: rgb(var(--glow)); }

  /* ---------- VFD (shared component) ---------- */
  .vfd { position: relative; display: inline-block; line-height: 0; }
  .vfd-window {
    position: relative; overflow: hidden; border-radius: 3px;
    background:
      radial-gradient(120% 140% at 50% 55%, #0b1417 0%, #070c0e 55%, #040607 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), inset 0 2px 8px rgba(0,0,0,.9);
  }
  .vfd canvas { display: block; width: 100%; height: auto; }
  .vfd canvas.lit {
    position: absolute; inset: 0;
    filter:
      drop-shadow(0 0 1px rgba(200, 245, 255, .95))
      drop-shadow(0 0 4px rgba(var(--glow), .6))
      drop-shadow(0 0 12px rgba(var(--glow), .28));
    animation: vfd-flicker 7s infinite steps(1);
  }
  @keyframes vfd-flicker {
    0%, 100% { opacity: 1; } 31% { opacity: .94; } 31.6% { opacity: 1; }
    64% { opacity: .97; } 64.4% { opacity: 1; } 88% { opacity: .95; } 88.3% { opacity: 1; }
  }
  /* control grid mesh sits just above the anodes: darkens lit dots in a fine weave */
  .vfd-mesh {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.42) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
  }
  /* filament wires: a few hair-thin horizontal lines across the whole tube */
  .vfd-filaments {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0 calc(var(--fil, 18px) - 1px), rgba(0,0,0,.55) calc(var(--fil, 18px) - 1px) var(--fil, 18px));
    opacity: .7;
  }
  .vfd-glass {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(172deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.015) 28%, transparent 46%),
      radial-gradient(40% 30% at 72% 78%, rgba(255,255,255,.035), transparent 70%);
  }
  .vfd-ann { position: absolute; left: 0; top: 0; display: flex; gap: .5em; padding: .35em .6em;
    font: 700 9px/1 var(--sans); letter-spacing: .08em; line-height: 1; z-index: 2; pointer-events: none; }
  .vfd-ann span { color: rgba(150, 210, 235, .10); transition: color .15s, text-shadow .15s; }
  .vfd-ann span.on { color: var(--phosphor); text-shadow: 0 0 2px rgba(200,245,255,.9), 0 0 8px rgba(var(--glow),.6); }

  /* static noise overlay used for transitions */
  .static-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; image-rendering: pixelated; mix-blend-mode: screen; }

  /* ---------- content (shared typography) ---------- */
  .content { font-size: 17px; line-height: 1.65; }
  .content h1 { font: 600 clamp(32px, 5vw, 52px)/1.05 var(--sans); letter-spacing: -.02em; margin: .2em 0 .35em; color: #f2f5f7; }
  .content h2 { font: 600 22px/1.25 var(--sans); margin: 1.6em 0 .5em; color: #eef2f4; }
  .content p { margin: 0 0 1em; }
  .content .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--glow)); opacity: .85; }
  .content .lede { font-size: 20px; color: #c3cad0; max-width: 34em; }
  .content .muted { color: var(--dim); }
  .content code { font-family: var(--mono); font-size: .88em; background: #11171a; padding: .1em .35em; border-radius: 3px; }
  .content pre { background: #0c1113; border: 1px solid #172126; padding: 14px 16px; border-radius: 6px; overflow-x: auto; }
  .content pre code { background: none; padding: 0; }
  .content article { font-family: var(--serif); font-size: 19px; }
  .content article h1, .content article h2 { font-family: var(--sans); }
  .c-index { list-style: none; padding: 0; margin: 1.6em 0 0; border-top: 1px solid #1a2226; }
  .c-index a { display: grid; grid-template-columns: 5.5em 9em 1fr; gap: 1em; padding: .8em .2em; border-bottom: 1px solid #1a2226; color: inherit; text-decoration: none; align-items: baseline; }
  .c-index a:hover { background: #0b1013; }
  .c-index .f { font-family: var(--mono); color: rgb(var(--glow)); }
  .c-index .n { font-weight: 600; color: #eef2f4; }
  .c-index .d { color: var(--dim); }
  .c-posts { list-style: none; padding: 0; margin: 1em 0; }
  .c-posts li { padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-posts a { font-weight: 600; font-size: 20px; color: #eef2f4; text-decoration: none; }
  .c-posts a:hover { color: rgb(var(--glow)); }
  .c-posts .meta { font: 12px/1.4 var(--mono); color: var(--dim); letter-spacing: .05em; }
  .c-projects { display: grid; gap: 0; margin-top: 1em; }
  .c-projects .p { display: grid; grid-template-columns: 11em 1fr; gap: 1.2em; padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-projects .p b { color: #eef2f4; }
  .c-projects .p a { font: 12px var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .c-index a { grid-template-columns: 4.5em 1fr; } .c-index .d { grid-column: 2; }
    .c-projects .p { grid-template-columns: 1fr; gap: .2em; }
  }

  /* ---------- prototype switcher (not part of the design) ---------- */
  #proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
    background: #fff; color: #111; font: 600 13px/1 var(--sans); box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 2px #ff3d7f; }
  #proto-bar button { border: 0; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  #proto-bar button:hover { background: #ddd; }
  #proto-bar .lbl { padding: 0 10px; white-space: nowrap; }
  #proto-bar .state { font: 500 11px var(--mono); color: #666; padding-right: 10px; border-left: 1px solid #ddd; padding-left: 10px; white-space: nowrap; }

  /* ---------- Variant D: full screen, all dots ---------- */
  .vd { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none;
    background: radial-gradient(120% 120% at 50% 45%, #0a1316 0%, #060b0d 60%, #030506 100%); }
  .vd::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px rgba(0,0,0,.85); }
  .vd canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vd canvas.lit { filter: drop-shadow(0 0 1px rgba(200,245,255,.9)) drop-shadow(0 0 5px rgba(var(--glow),.45)); animation: vfd-flicker 7s infinite steps(1); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- round 2: cover panels in front of the tube ---------- */
  .vd .panel, .vd .panel > * { position: absolute; inset: 0; pointer-events: none; }
  .vd .panel canvas { width: 100%; height: 100%; }
  .vd[data-panel="none"] .panel { display: none; }
  .vd:not([data-panel="none"]) .vfd-glass { display: none; }
  .panel-glow { mix-blend-mode: screen; filter: drop-shadow(0 0 1.5px rgba(150,230,255,.7)) brightness(1.4); }
  .panel-ambient { mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(160deg, #000 0%, rgba(0,0,0,.4) 32%, rgba(0,0,0,.1) 60%, rgba(0,0,0,.55) 100%);
            mask-image: linear-gradient(160deg, #000 0%, rgba(0,0,0,.4) 32%, rgba(0,0,0,.1) 60%, rgba(0,0,0,.55) 100%); }
  .panel-reflect { will-change: transform; }
  [data-panel="acrylic"] .panel-tint { background: radial-gradient(130% 120% at 50% 50%, rgba(18,10,4,.08), rgba(8,5,2,.5)); }
  [data-panel="acrylic"] .panel-reflect { background:
      radial-gradient(16% 9% at 79% 17%, rgba(255,150,60,.055), transparent 70%),
      radial-gradient(9% 6% at 87% 27%, rgba(255,170,90,.04), transparent 70%),
      radial-gradient(6% 4% at 70% 9%, rgba(255,200,140,.03), transparent 70%),
      linear-gradient(165deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.012) 30%, transparent 45%); }
  [data-panel="glass"] .panel-tint { background: radial-gradient(140% 130% at 50% 50%, transparent 50%, rgba(0,0,0,.35)); }
  [data-panel="glass"] .panel-reflect { inset: -40px; background:
      linear-gradient(118deg, transparent 0 22%, rgba(255,255,255,.05) 22.6%, rgba(255,255,255,.022) 27%, transparent 27.6% 100%),
      linear-gradient(118deg, transparent 0 29%, rgba(255,255,255,.03) 29.4% 30.4%, transparent 31%),
      radial-gradient(60% 50% at 18% 8%, rgba(255,255,255,.04), transparent 70%); }
  [data-panel="worn"] .panel-tint { background: rgba(34,26,10,.2); mix-blend-mode: multiply; }
  [data-panel="worn"] .panel-reflect { inset: -40px; background:
      radial-gradient(90% 80% at 50% 50%, transparent 35%, rgba(215,225,230,.045) 100%),
      linear-gradient(172deg, rgba(255,255,255,.045), transparent 42%); }
  .bezel { position: absolute; inset: 14px; border-radius: 18px; pointer-events: none;
    box-shadow: 0 0 0 80px #08090a, inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 1px rgba(255,255,255,.05), inset 0 0 40px rgba(0,0,0,.9); }
  .fil-glow { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0 calc(var(--fil, 18px) - 1px), rgba(255,90,30,.55) calc(var(--fil, 18px) - 1px) var(--fil, 18px));
    filter: blur(.5px) drop-shadow(0 0 3px rgba(255,80,30,.7)); }
  .vd.fil-on .fil-glow { opacity: .6; }
  .vd .vfd-filaments { opacity: .35; background: repeating-linear-gradient(180deg, transparent 0 calc(var(--fil, 18px) - 1px), rgba(0,0,0,.55) calc(var(--fil, 18px) - 1px) var(--fil, 18px)); }
  .sound-btn { cursor: pointer; }
  .sound-btn.on { color: var(--phosphor) !important; text-shadow: 0 0 6px rgba(var(--glow), .8); }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-bar" hidden>
  <button id="pb-prev" aria-label="Previous variant">←</button>
  <span class="lbl" id="pb-label"></span>
  <span class="state" id="pb-state"></span>
  <button id="pb-next" aria-label="Next variant">→</button>

<script>
/* =====================================================================
   Content (placeholder unless noted)
   ===================================================================== */
const STATIONS = [
  { id: 'home',     preset: 1, freq: 88.1,  ps: 'JASPER',   title: 'Station ID', blurb: 'Who is broadcasting',
    rt: 'JASPER LUTZ SEVERINO  *  A MIND ON A FEW FREQUENCIES  *  PICK A CHANNEL TO TUNE IN' },
  { id: 'about',    preset: 2, freq: 91.3,  ps: 'ABOUT',    title: 'About',      blurb: 'The longer introduction',
    rt: 'ABOUT  *  WHO I AM AND WHAT I CARE ABOUT' },
  { id: 'projects', preset: 3, freq: 95.7,  ps: 'PROJECTS', title: 'Projects',   blurb: 'Things I build and run',
    rt: 'PROJECTS  *  7 ON AIR  *  REPO CANON, SCRIPTORIUM, POSTERN, HOMELAB...' },
  { id: 'blog',     preset: 4, freq: 99.1,  ps: 'BLOG',     title: 'Blog',       blurb: 'Long-form writing, in Markdown',
    rt: '' /* filled from latest post */ },
  { id: 'contact',  preset: 5, freq: 103.9, ps: 'CONTACT',  title: 'Contact',    blurb: 'How to reach me',
    rt: 'CONTACT  *  GITHUB.COM/LUTZSEVERINO' },
];

// Real project names + descriptions, copied from each repository's README (2026-11-01).
const PROJECTS = [
  ['Repo Canon', 'Shared documentation, contribution, and coding-agent conventions for maintainers who want consistent repositories.', 'https://github.com/lutzseverino/repo-canon'],
  ['Repository Standards', 'A CLI and agent skills for publishing and applying versioned repository standards.', 'https://github.com/lutzseverino/repo-standards'],
  ['Scriptorium', 'A self-hosted service that implements ready GitHub issues with coding agents in sandboxes, for maintainers who run it on their own machine.', 'https://github.com/lutzseverino/scriptorium'],
  ['Postern', 'A Node.js library that gives developers building tools one interface to code hosting platforms such as GitHub, and reports only facts the platform states.', 'https://github.com/lutzseverino/postern'],
  ['Hemiciclo', "Working code name for a neutral, at-a-glance view of every country's political situation.", 'https://github.com/lutzseverino/hemiciclo'],
  ['Odonta', 'Dental clinic management software for the web.', 'https://github.com/zarcerog/odonta'],
  ['Homelab', "Host tooling and operating guidance for a Raspberry Pi and an always-on homeserver.", 'https://github.com/lutzseverino/homelab'],
];

// In the real site these are .md files (e.g. src/content/blog/*.md) with front matter.
const POSTS = [
  { slug: 'tuning-in', date: '2026-10-28', title: 'Tuning in (sample post)', summary: 'Why this site looks like a car radio, and what the channels are.',
    md: `Placeholder post. Replace with your own words.

My head runs on a handful of frequencies. Some days one of them is loud and the rest are static. This site is a receiver: each channel is one of those frequencies.

## How the dial is laid out

- **88.1** is the station ID: who's broadcasting.
- **95.7** carries projects.
- **99.1** carries this blog.

Posts are plain Markdown files in the repository, so writing one is:

\`\`\`
src/content/blog/tuning-in.md
\`\`\`

and a push.` },
  { slug: 'long-wave', date: '2026-10-12', title: 'Long wave, 171 kHz (sample post)', summary: 'A night drive, a dashboard, and a display that glowed like this one.',
    md: `Placeholder post.

The first frame of this site's intro is a photo: a car's radio at night, tuned to **LW 171 kHz**, the dot-matrix display glowing through its mesh.

Long wave travels far and carries little. That felt right for a blog.` },
  { slug: 'standards', date: '2026-09-30', title: 'Writing standards down (sample post)', summary: 'Notes on keeping many repositories consistent without a meeting.',
    md: `Placeholder post about [Repo Canon](https://github.com/lutzseverino/repo-canon).

Short paragraphs, real links, and \`inline code\` all render from Markdown.` },
];
STATIONS.find(s => s.id === 'blog').rt = `BLOG  *  LATEST: ${POSTS[0].title.toUpperCase()}`;

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(src) { // tiny Markdown → HTML, enough for the prototype
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  const out = []; const blocks = src.split(/\n\n+/);
  for (let i = 0; i < blocks.length; i++) {
    let b = blocks[i];
    if (b.startsWith('```')) {
      while (!b.trimEnd().endsWith('```') || b.trim() === '```') { if (i + 1 >= blocks.length) break; b += '\n\n' + blocks[++i]; }
      out.push(`<pre><code>${esc(b.replace(/^```\w*\n?/, '').replace(/\n?```\s*$/, ''))}</code></pre>`);
    } else if (/^## /.test(b)) out.push(`<h2>${inline(b.slice(3))}</h2>`);
    else if (/^# /.test(b)) out.push(`<h1>${inline(b.slice(2))}</h1>`);
    else if (/^- /.test(b)) out.push('<ul>' + b.split('\n').map(l => `<li>${inline(l.replace(/^- /, ''))}</li>`).join('') + '</ul>');
    else out.push(`<p>${inline(b)}</p>`);
  }
  return out.join('\n');
}

const fmtF = f => f.toFixed(1);
function renderStation(st, sub) {
  if (!st) return '';
  switch (st.id) {
    case 'home': return `
      <p class="kicker">${fmtF(st.freq)} FM · station ID</p>
      <h1>Jasper Lutz Severino</h1>
      <p class="lede">My mind is a handful of frequencies. This site is the receiver. Pick a channel to tune in.</p>
      <ul class="c-index">${STATIONS.filter(s => s.id !== 'home').map(s =>
        `<li><a href="#${s.id}"><span class="f">${fmtF(s.freq)}</span><span class="n">${s.title}</span><span class="d">${s.blurb}</span></a></li>`).join('')}</ul>`;
    case 'about': return `
      <p class="kicker">${fmtF(st.freq)} FM · about</p>
      <h1>About</h1>
      <p class="lede">Placeholder. I build tools for maintainers and the machines that run them.</p>
      <p>Write the longer version here: what you do, what you're curious about, what you're tuning into lately. This is a plain page, so it can be as long as it needs to be.</p>
      <p class="muted">Everything on this channel is placeholder copy.</p>`;
    case 'projects': return `
      <p class="kicker">${fmtF(st.freq)} FM · projects</p>
      <h1>Projects</h1>
      <div class="c-projects">${PROJECTS.map(([n, d, u]) => `<div class="p"><div><b>${n}</b><br><a href="${u}">${u.replace('https://', '')}</a></div><div>${esc(d)}</div></div>`).join('')}</div>`;
    case 'blog': {
      const post = sub && POSTS.find(p => p.slug === sub);
      if (post) return `
        <p class="kicker"><a href="#blog">← ${fmtF(st.freq)} FM · blog</a></p>
        <article><h1>${esc(post.title)}</h1><p class="muted" style="font:13px var(--mono)">${post.date}</p>${md(post.md)}</article>`;
      return `
        <p class="kicker">${fmtF(st.freq)} FM · blog</p>
        <h1>Blog</h1>
        <ul class="c-posts">${POSTS.map(p => `<li><div class="meta">${p.date}</div><a href="#blog/${p.slug}">${esc(p.title)}</a><div class="muted">${esc(p.summary)}</div></li>`).join('')}</ul>`;
    }
    case 'contact': return `
      <p class="kicker">${fmtF(st.freq)} FM · contact</p>
      <h1>Contact</h1>
      <p class="lede">The fastest way to reach me is <a href="https://github.com/lutzseverino">github.com/lutzseverino</a>.</p>
      <p class="muted">Placeholder: add email or other channels here.</p>`;
  }
}

/* =====================================================================
   VFD dot-matrix renderer (shared). 5×7 glyphs, column bytes, bit0 = top.
   ===================================================================== */
const G = {
  ' ': [0,0,0,0,0], '!': [0,0,0x5F,0,0], '"': [0,7,0,7,0], '#': [0x14,0x7F,0x14,0x7F,0x14], '&': [0x36,0x49,0x55,0x22,0x50],
  "'": [0,5,3,0,0], '(': [0,0x1C,0x22,0x41,0], ')': [0,0x41,0x22,0x1C,0], '*': [0x14,0x08,0x3E,0x08,0x14], '+': [8,8,0x3E,8,8],
  ',': [0,0x50,0x30,0,0], '-': [8,8,8,8,8], '.': [0,0x60,0x60,0,0], '/': [0x20,0x10,8,4,2], ':': [0,0x36,0x36,0,0],
  '<': [8,0x14,0x22,0x41,0], '=': [0x14,0x14,0x14,0x14,0x14], '>': [0,0x41,0x22,0x14,8], '?': [2,1,0x51,9,6], '@': [0x32,0x49,0x79,0x41,0x3E],
  '_': [0x40,0x40,0x40,0x40,0x40], '%': [0x23,0x13,0x08,0x64,0x62], '[': [0,0x7F,0x41,0x41,0], ']': [0,0x41,0x41,0x7F,0], ';': [0,0x56,0x36,0,0], '|': [0,0,0x7F,0,0], '►': [0x7F,0x3E,0x1C,0x08,0], '◄': [0,0x08,0x1C,0x3E,0x7F], '█': [0x7F,0x7F,0x7F,0x7F,0x7F],
  '0': [0x3E,0x51,0x49,0x45,0x3E], '1': [0,0x42,0x7F,0x40,0], '2': [0x42,0x61,0x51,0x49,0x46], '3': [0x21,0x41,0x45,0x4B,0x31], '4': [0x18,0x14,0x12,0x7F,0x10],

      const k = skipping ? 1 : Math.min(1, (now - at) / 500), h = Math.max(1, Math.round(ease(k) * 6));
      const b = sc.lock ? (s.id === 'home' ? 1 : .22) : .85;
      for (let j = 1; j <= h; j++) a.put(col(s.freq), R - j, '█', b * (j === h ? 1 : .75));
      a.put(col(s.freq) - Math.floor(s.ps.length / 2), R - h - 2 - (a.cols < 50 && i % 2 ? 1 : 0), s.ps, b * k);
      a.put(col(s.freq) - 2, R + 2, fmtF(s.freq), b * k * .6);
    });
    if (sc.msg) a.put(Math.floor((a.cols - sc.msg.length) / 2), R + 4, sc.msg, 1);
  }
  async function powerTest(ms = 420) { I.all = 1; await tween(ms); I.all = 0; await tween(240); }
  async function landHome(k, { clickPresets = true } = {}) {
    Object.assign(I, { header: 88.1, label: null, big: { s: k.bigS }, nameRow: k.nameRow, name: NAME.length, nameP: null, noise: 0, ghosts: null, center: null, scan: null });
    if (clickPresets) for (let i = 1; i <= STATIONS.length; i++) { I.bar = i; Sound.click(.18); await tween(150); }
    S.painter = null; S.freq = 88.1; S.reveal = k.nameIdx + 1; compose();
    while (S.reveal < S.lines.length && !skipping) { S.reveal++; compose(); await wait(55); }
    S.reveal = Infinity; compose();
  }
  const seekTo = (from, to, ms, label = 'SEEK ►') => tween(ms, t => { I.header = Math.round((from + (to - from) * ease(t)) * 10) / 10; I.label = label; });
  const INTROS = {
    // round 1's intro, unchanged
    async classic(k) {
      await wait(300); await powerTest(450);
      I.center = [[0, 'LW       171 kHz']]; await tween(1100);
      Sound.set(.8); await tween(900, t => { const f = Math.round((87.5 + .6 * ease(t)) * 10) / 10; I.center = [[-1, 'SEEK ►'], [0, `FM1     ${fmtF(f).padStart(5)}MHz`]]; }); Sound.set(0);
      I.center = null; S.painter = null; S.freq = 88.1; S.reveal = 0; compose();
      while (S.reveal < S.lines.length && !skipping) { S.reveal++; compose(); await wait(45); }
      S.reveal = Infinity; compose();
    },
    // the tube warms (filaments glow dull orange), self-test, the photo's frame, then the name scans in
    async ignition(k) {
      await wait(500); wrap.classList.add('fil-on'); await tween(1400);
      await powerTest(500); wrap.classList.remove('fil-on');
      I.center = [[0, 'LW       171 kHz']]; await tween(1000);
      Sound.set(.7); await tween(1000, t => { const f = Math.round((87.5 + .6 * ease(t)) * 10) / 10; I.header = f; I.label = 'SEEK ►'; I.center = [[0, `${fmtF(f)} MHz`]]; }); Sound.set(0);
      I.center = null; I.label = null; I.header = 88.1;
      I.big = { s: k.bigS, maxX: -1 }; await tween(1400, t => { I.big.maxX = k.lay.left * 5 + ease(t) * 36 * k.bigS; });
      I.big = { s: k.bigS }; I.nameRow = k.nameRow; await tween(900, t => { I.name = Math.round(t * NAME.length); });
      const rt = 'a mind on a few frequencies';
      await tween(2200, t => { I.rt = { c: Math.round(G.cols - t * (G.cols - k.lay.left)), r: k.nameRow + 2, t: rt, b: .75 }; });
      await tween(600); I.rt = null;
      await landHome(k);
    },
    // a band scan: the whole screen becomes a spectrum and each channel rises as a peak
    async scan(k) {
      await wait(300); await powerTest(400);
      I.scan = { cur: 87.5, found: [] };
      await tween(2800, t => { const f = 87.5 + t * 20.5; I.scan.cur = f; I.header = Math.round(f * 10) / 10; I.label = 'SCAN ►';
        for (const s of STATIONS) if (s.freq <= f && !I.scan.found.some(x => x.s === s)) { I.scan.found.push({ s, at: performance.now() }); Sound.click(.2); } });
      I.scan.msg = `${STATIONS.length} STATIONS FOUND`; await tween(1000);
      I.scan.msg = null; await tween(800, t => { const f = 108 - (108 - 88.1) * ease(t); I.scan.cur = f; I.header = Math.round(f * 10) / 10; I.label = '◄ SEEK'; });
      I.label = null; I.header = 88.1; I.scan.lock = true; await tween(800);
      I.scan = null; I.noise = .2; Sound.set(.6); await tween(320); I.noise = 0; Sound.set(0);
      await landHome(k);
    },
    // tuning by hand through static: fragments of the other channels bleed through, then the ID resolves
    async bleed(k) {
      await wait(300);
      I.noise = .09; I.noiseB = .32; Sound.set(.5);
      const frags = ['REPO CANON', 'Tuning in', 'HOMELAB', 'a mind on a few frequencies', 'SCRIPTORIUM', 'Long wave, 171 kHz', 'POSTERN', "who's broadcasting?", 'HEMICICLO', 'Writing standards down', 'PROJECTS', 'CONTACT'];
      const R = rng(Date.now() & 0xffff);
      let f0 = 87.5;
      for (const st of [93.6, 97.2, 104.1, 100.3, 106.8]) {
        await seekTo(f0, st, 450); f0 = st;
        I.ghosts = [0, 1].map(() => { const t = frags[Math.floor(R() * frags.length)]; return { t, c: Math.floor(R() * Math.max(1, G.cols - t.length)), r: 4 + Math.floor(R() * Math.max(1, G.rows - 7)), b: .9, keep: .4 }; });
        Sound.set(.25); await tween(700, t => I.ghosts.forEach(g => g.keep = .3 + .5 * Math.sin(t * Math.PI))); I.ghosts = null; Sound.set(.5);
      }
      I.big = { s: k.bigS, p: 0 }; I.nameRow = k.nameRow; I.nameP = 0;
      await tween(2400, t => { I.header = Math.round((f0 + (88.1 - f0) * ease(t)) * 10) / 10; I.label = t < .95 ? '◄ SEEK' : null; I.noise = .09 * (1 - t); I.big.p = ease(Math.min(1, t * 1.15)); I.nameP = Math.max(0, t * 1.5 - .5); Sound.set(.5 * (1 - t)); });
      Sound.set(0); await tween(400);
      await landHome(k);
    },
  };

  return {
    async start() {
      build(); const r = route();
      if (r.st) { S.painter = paintIntro; await powerTest(300); S.painter = null; return tune(r.st, r.sub); } // deep links: short power-on only
      S.st = byId('home'); S.freq = 87.5; layout();
      const lay = L(), nameIdx = S.lines.findIndex(l => l.segs.some(x => x.t === 'Jasper'));
      const k = { lay, bigS: S.lines[0].big.s, nameIdx, nameRow: lay.top + nameIdx };
      S.painter = paintIntro;
      await (INTROS[cfg.intro] || INTROS.classic)(k);
      S.painter = null; S.freq = 88.1; S.reveal = Infinity; wrap.classList.remove('fil-on'); compose();
      renderState(S.st); sr.innerHTML = renderStation(S.st);
    },
    onRoute() { const r = route(); tune(r.st || byId('home'), r.sub); },
  };
}

/* =====================================================================
   Variant switcher + boot
   ===================================================================== */
const VARIANTS = {
  acrylic: ['Smoked acrylic · ignition intro', { panel: 'acrylic', intro: 'ignition' }],
  glass:   ['Glass in a bezel · band-scan intro', { panel: 'glass', intro: 'scan', bezel: true, parallax: true }],
  worn:    ['Worn plastic · bleed-through intro', { panel: 'worn', intro: 'bleed', parallax: true }],
  base:    ['Round 1 D, as picked', { panel: 'none', intro: 'classic' }],
};
const keyHandlers = []; const onKey = f => keyHandlers.push(f);
const params = new URLSearchParams(location.search);
const vKey = VARIANTS[params.get('variant')] ? params.get('variant') : 'acrylic';
const cfg = { ...VARIANTS[vKey][1] };
for (const k of ['panel', 'intro']) if (params.get(k)) cfg[k] = params.get(k);          // mix: ?panel=worn&intro=scan
for (const k of ['bezel', 'parallax']) if (params.has(k)) cfg[k] = params.get(k) === '1';
function go(dir) {
  const ks = Object.keys(VARIANTS); const k = ks[(ks.indexOf(vKey) + dir + ks.length) % ks.length];
  for (const x of ['panel', 'intro', 'bezel', 'parallax']) params.delete(x);
  params.set('variant', k); location.href = location.pathname + '?' + params.toString() + location.hash;
}
function renderState(st) {
  const el = document.getElementById('pb-state'); if (!el) return;
  const r = route();
  el.textContent = `${cfg.panel} · ${cfg.intro}${cfg.bezel ? ' · bezel' : ''}${cfg.parallax ? ' · parallax' : ''} · ` + (st ? `${fmtF(st.freq)} ${st.ps}${r.sub ? '/' + r.sub : ''}` : 'intro') + (Sound.on ? ' · sound' : '');
}
if (params.get('bar') !== '0') { // ?bar=0 hides the switcher for screenshots
  const bar = document.getElementById('proto-bar'); bar.hidden = false;
  document.getElementById('pb-label').textContent = `${vKey} (${VARIANTS[vKey][0]})`;
  document.getElementById('pb-prev').onclick = () => go(-1); document.getElementById('pb-next').onclick = () => go(1);
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (!e.metaKey && !e.ctrlKey && !['ArrowLeft', 'ArrowRight'].includes(e.key)) skipIntro();
  if (e.key === 'ArrowLeft') return go(-1);
  if (e.key === 'ArrowRight') return go(1);
  keyHandlers.forEach(f => f(e));
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#proto-bar')) skipIntro(); }, { capture: true });
const variant = Receiver(document.getElementById('app'), cfg);
renderState(null);
variant.start().then(() => { introActive = false; skipping = false; skipHooks.clear(); window.addEventListener('hashchange', () => variant.onRoute()); if (location.hash) variant.onRoute(); });
</script>
</body>
