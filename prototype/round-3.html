<!doctype html>
<!--
  PROTOTYPE — throwaway, round 3. Round 1 (round-1.html): the owner picked D, the full-screen
  dot-matrix receiver. Round 2 (round-2.html): the owner picked the smoked acrylic cover.
  Question now: "What does a proper 3D screen look like, and an intro that finds the channel?"
  Every variant: acrylic cover; one WebGL pass bends the dot-matrix onto a curved, tilting screen
  in its housing (reflections and the lit scratches follow the curve); the same intro: a moment
  fully off, power-on, a seek down the band that catches each channel, lock, the RDS name decodes,
  the frequency dissolves into the station. A deep link seeks straight to its own channel.
    crt   bulging glass, like a CRT tube face
    bowl  concave, set back into the housing; starts in standby (clock), press any key to power on,
          which also turns sound on: browsers allow no sound before a click or key
    dash  set into a dashboard and seen from below, the screen turns more with the pointer
    flat  round 2's flat acrylic, with the new intro, for comparison
  Tweak: ?k=<curvature, negative is concave>&follow=<degrees>&scale=<0..1>&power=button|auto
  Sound: quiet. Static and a faint tuning whistle while seeking, a soft note per channel on lock
  (each channel has its own pitch), a relay tock and hum at power-on, soft clicks for presets.
-->

<head>
<meta charset="utf-8" />

<title>PROTOTYPE · receiver · round 3</title>
<style>
  :root {
    --phosphor: #e6fbff;
    --glow: 120, 220, 255;
    --ink: #d9dee2;
    --dim: #7c868d;
    --bg: #050607;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; }
  a { color: rgb(var(--glow)); }

  /* ---------- VFD (shared component) ---------- */
  .vfd { position: relative; display: inline-block; line-height: 0; }
  .vfd-window {
    position: relative; overflow: hidden; border-radius: 3px;
    background:
      radial-gradient(120% 140% at 50% 55%, #0b1417 0%, #070c0e 55%, #040607 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), inset 0 2px 8px rgba(0,0,0,.9);
  }
  .vfd canvas { display: block; width: 100%; height: auto; }
  .vfd canvas.lit {
    position: absolute; inset: 0;
    filter:
      drop-shadow(0 0 1px rgba(200, 245, 255, .95))
      drop-shadow(0 0 4px rgba(var(--glow), .6))
      drop-shadow(0 0 12px rgba(var(--glow), .28));
    animation: vfd-flicker 7s infinite steps(1);
  }
  @keyframes vfd-flicker {
    0%, 100% { opacity: 1; } 31% { opacity: .94; } 31.6% { opacity: 1; }
    64% { opacity: .97; } 64.4% { opacity: 1; } 88% { opacity: .95; } 88.3% { opacity: 1; }
  }
  /* control grid mesh sits just above the anodes: darkens lit dots in a fine weave */
  .vfd-mesh {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.42) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
  }
  /* filament wires: a few hair-thin horizontal lines across the whole tube */
  .vfd-filaments {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0 calc(var(--fil, 18px) - 1px), rgba(0,0,0,.55) calc(var(--fil, 18px) - 1px) var(--fil, 18px));
    opacity: .7;
  }
  .vfd-glass {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(172deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.015) 28%, transparent 46%),
      radial-gradient(40% 30% at 72% 78%, rgba(255,255,255,.035), transparent 70%);
  }
  .vfd-ann { position: absolute; left: 0; top: 0; display: flex; gap: .5em; padding: .35em .6em;
    font: 700 9px/1 var(--sans); letter-spacing: .08em; line-height: 1; z-index: 2; pointer-events: none; }
  .vfd-ann span { color: rgba(150, 210, 235, .10); transition: color .15s, text-shadow .15s; }
  .vfd-ann span.on { color: var(--phosphor); text-shadow: 0 0 2px rgba(200,245,255,.9), 0 0 8px rgba(var(--glow),.6); }

  /* static noise overlay used for transitions */
  .static-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; image-rendering: pixelated; mix-blend-mode: screen; }

  /* ---------- content (shared typography) ---------- */
  .content { font-size: 17px; line-height: 1.65; }
  .content h1 { font: 600 clamp(32px, 5vw, 52px)/1.05 var(--sans); letter-spacing: -.02em; margin: .2em 0 .35em; color: #f2f5f7; }
  .content h2 { font: 600 22px/1.25 var(--sans); margin: 1.6em 0 .5em; color: #eef2f4; }
  .content p { margin: 0 0 1em; }
  .content .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--glow)); opacity: .85; }
  .content .lede { font-size: 20px; color: #c3cad0; max-width: 34em; }
  .content .muted { color: var(--dim); }
  .content code { font-family: var(--mono); font-size: .88em; background: #11171a; padding: .1em .35em; border-radius: 3px; }
  .content pre { background: #0c1113; border: 1px solid #172126; padding: 14px 16px; border-radius: 6px; overflow-x: auto; }
  .content pre code { background: none; padding: 0; }
  .content article { font-family: var(--serif); font-size: 19px; }
  .content article h1, .content article h2 { font-family: var(--sans); }
  .c-index { list-style: none; padding: 0; margin: 1.6em 0 0; border-top: 1px solid #1a2226; }
  .c-index a { display: grid; grid-template-columns: 5.5em 9em 1fr; gap: 1em; padding: .8em .2em; border-bottom: 1px solid #1a2226; color: inherit; text-decoration: none; align-items: baseline; }
  .c-index a:hover { background: #0b1013; }
  .c-index .f { font-family: var(--mono); color: rgb(var(--glow)); }
  .c-index .n { font-weight: 600; color: #eef2f4; }
  .c-index .d { color: var(--dim); }
  .c-posts { list-style: none; padding: 0; margin: 1em 0; }
  .c-posts li { padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-posts a { font-weight: 600; font-size: 20px; color: #eef2f4; text-decoration: none; }
  .c-posts a:hover { color: rgb(var(--glow)); }
  .c-posts .meta { font: 12px/1.4 var(--mono); color: var(--dim); letter-spacing: .05em; }
  .c-projects { display: grid; gap: 0; margin-top: 1em; }
  .c-projects .p { display: grid; grid-template-columns: 11em 1fr; gap: 1.2em; padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-projects .p b { color: #eef2f4; }
  .c-projects .p a { font: 12px var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .c-index a { grid-template-columns: 4.5em 1fr; } .c-index .d { grid-column: 2; }

  /* ---------- prototype switcher (not part of the design) ---------- */
  #proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;

  #proto-bar button { border: 0; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  #proto-bar button:hover { background: #ddd; }
  #proto-bar .lbl { padding: 0 10px; white-space: nowrap; }
  #proto-bar .state { font: 500 11px var(--mono); color: #666; padding-right: 10px; border-left: 1px solid #ddd; padding-left: 10px; white-space: nowrap; }

  /* ---------- round 3: the receiver is one WebGL canvas ---------- */
  .vd { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; background: #030303; }
  .vd canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; animation: vfd-flicker3 7s infinite steps(1); }
  @keyframes vfd-flicker3 { 0%, 100% { opacity: 1; } 31% { opacity: .975; } 31.6% { opacity: 1; } 64% { opacity: .985; } 64.4% { opacity: 1; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<script>

const STATIONS = [

    rt: '' /* filled from latest post */ },

// Real project names + descriptions, copied from each repository's README (2026-11-01).
const PROJECTS = [
  ['Repo Canon', 'Shared documentation, contribution, and coding-agent conventions for maintainers who want consistent repositories.', 'https://github.com/lutzseverino/repo-canon'],
  ['Repository Standards', 'A CLI and agent skills for publishing and applying versioned repository standards.', 'https://github.com/lutzseverino/repo-standards'],

  ['Homelab', "Host tooling and operating guidance for a Raspberry Pi and an always-on homeserver.", 'https://github.com/lutzseverino/homelab'],

// In the real site these are .md files (e.g. src/content/blog/*.md) with front matter.
const POSTS = [
  { slug: 'tuning-in', date: '2026-10-28', title: 'Tuning in (sample post)', summary: 'Why this site looks like a car radio, and what the channels are.',
    md: `Placeholder post. Replace with your own words.

My head runs on a handful of frequencies. Some days one of them is loud and the rest are static. This site is a receiver: each channel is one of those frequencies.

## How the dial is laid out

  { slug: 'long-wave', date: '2026-10-12', title: 'Long wave, 171 kHz (sample post)', summary: 'A night drive, a dashboard, and a display that glowed like this one.',

Long wave travels far and carries little. That felt right for a blog.` },

Short paragraphs, real links, and \`inline code\` all render from Markdown.` },

STATIONS.find(s => s.id === 'blog').rt = `BLOG  *  LATEST: ${POSTS[0].title.toUpperCase()}`;

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(src) { // tiny Markdown → HTML, enough for the prototype
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  const out = []; const blocks = src.split(/\n\n+/);
  for (let i = 0; i < blocks.length; i++) {
    let b = blocks[i];
    if (b.startsWith('```')) {
      while (!b.trimEnd().endsWith('```') || b.trim() === '```') { if (i + 1 >= blocks.length) break; b += '\n\n' + blocks[++i]; }
      out.push(`<pre><code>${esc(b.replace(/^```\w*\n?/, '').replace(/\n?```\s*$/, ''))}</code></pre>`);
    } else if (/^## /.test(b)) out.push(`<h2>${inline(b.slice(3))}</h2>`);
    else if (/^# /.test(b)) out.push(`<h1>${inline(b.slice(2))}</h1>`);
    else if (/^- /.test(b)) out.push('<ul>' + b.split('\n').map(l => `<li>${inline(l.replace(/^- /, ''))}</li>`).join('') + '</ul>');
    else out.push(`<p>${inline(b)}</p>`);
  }
  return out.join('\n');
}

const fmtF = f => f.toFixed(1);
function renderStation(st, sub) {
  if (!st) return '';
  switch (st.id) {
    case 'home': return `
      <p class="kicker">${fmtF(st.freq)} FM · station ID</p>
      <h1>Jasper Lutz Severino</h1>
      <p class="lede">My mind is a handful of frequencies. This site is the receiver. Pick a channel to tune in.</p>
      <ul class="c-index">${STATIONS.filter(s => s.id !== 'home').map(s =>
        `<li><a href="#${s.id}"><span class="f">${fmtF(s.freq)}</span><span class="n">${s.title}</span><span class="d">${s.blurb}</span></a></li>`).join('')}</ul>`;
    case 'about': return `
      <p class="kicker">${fmtF(st.freq)} FM · about</p>
      <h1>About</h1>
      <p class="lede">Placeholder. I build tools for maintainers and the machines that run them.</p>
      <p>Write the longer version here: what you do, what you're curious about, what you're tuning into lately. This is a plain page, so it can be as long as it needs to be.</p>
      <p class="muted">Everything on this channel is placeholder copy.</p>`;
    case 'projects': return `
      <p class="kicker">${fmtF(st.freq)} FM · projects</p>
      <h1>Projects</h1>
      <div class="c-projects">${PROJECTS.map(([n, d, u]) => `<div class="p"><div><b>${n}</b><br><a href="${u}">${u.replace('https://', '')}</a></div><div>${esc(d)}</div></div>`).join('')}</div>`;
    case 'blog': {
      const post = sub && POSTS.find(p => p.slug === sub);
      if (post) return `
        <p class="kicker"><a href="#blog">← ${fmtF(st.freq)} FM · blog</a></p>
        <article><h1>${esc(post.title)}</h1><p class="muted" style="font:13px var(--mono)">${post.date}</p>${md(post.md)}</article>`;
      return `
        <p class="kicker">${fmtF(st.freq)} FM · blog</p>
        <h1>Blog</h1>
        <ul class="c-posts">${POSTS.map(p => `<li><div class="meta">${p.date}</div><a href="#blog/${p.slug}">${esc(p.title)}</a><div class="muted">${esc(p.summary)}</div></li>`).join('')}</ul>`;
    }
    case 'contact': return `
      <p class="kicker">${fmtF(st.freq)} FM · contact</p>
      <h1>Contact</h1>
      <p class="lede">The fastest way to reach me is <a href="https://github.com/lutzseverino">github.com/lutzseverino</a>.</p>
      <p class="muted">Placeholder: add email or other channels here.</p>`;
  }
}

/* =====================================================================
   VFD dot-matrix renderer (shared). 5×7 glyphs, column bytes, bit0 = top.
   ===================================================================== */
const G = {
  ' ': [0,0,0,0,0], '!': [0,0,0x5F,0,0], '"': [0,7,0,7,0], '#': [0x14,0x7F,0x14,0x7F,0x14], '&': [0x36,0x49,0x55,0x22,0x50],
  "'": [0,5,3,0,0], '(': [0,0x1C,0x22,0x41,0], ')': [0,0x41,0x22,0x1C,0], '*': [0x14,0x08,0x3E,0x08,0x14], '+': [8,8,0x3E,8,8],
  ',': [0,0x50,0x30,0,0], '-': [8,8,8,8,8], '.': [0,0x60,0x60,0,0], '/': [0x20,0x10,8,4,2], ':': [0,0x36,0x36,0,0],
  '<': [8,0x14,0x22,0x41,0], '=': [0x14,0x14,0x14,0x14,0x14], '>': [0,0x41,0x22,0x14,8], '?': [2,1,0x51,9,6], '@': [0x32,0x49,0x79,0x41,0x3E],
  '_': [0x40,0x40,0x40,0x40,0x40], '%': [0x23,0x13,0x08,0x64,0x62], '[': [0,0x7F,0x41,0x41,0], ']': [0,0x41,0x41,0x7F,0], ';': [0,0x56,0x36,0,0], '|': [0,0,0x7F,0,0], '►': [0x7F,0x3E,0x1C,0x08,0], '◄': [0,0x08,0x1C,0x3E,0x7F], '█': [0x7F,0x7F,0x7F,0x7F,0x7F],
  '0': [0x3E,0x51,0x49,0x45,0x3E], '1': [0,0x42,0x7F,0x40,0], '2': [0x42,0x61,0x51,0x49,0x46], '3': [0x21,0x41,0x45,0x4B,0x31], '4': [0x18,0x14,0x12,0x7F,0x10],
  '5': [0x27,0x45,0x45,0x45,0x39], '6': [0x3C,0x4A,0x49,0x49,0x30], '7': [1,0x71,9,5,3], '8': [0x36,0x49,0x49,0x49,0x36], '9': [6,0x49,0x49,0x29,0x1E],
  A: [0x7C,0x12,0x11,0x12,0x7C], B: [0x7F,0x49,0x49,0x49,0x36], C: [0x3E,0x41,0x41,0x41,0x22], D: [0x7F,0x41,0x41,0x22,0x1C], E: [0x7F,0x49,0x49,0x49,0x41],
  F: [0x7F,9,9,9,1], G: [0x3E,0x41,0x49,0x49,0x7A], H: [0x7F,8,8,8,0x7F], I: [0,0x41,0x7F,0x41,0], J: [0x20,0x40,0x41,0x3F,1],
  K: [0x7F,8,0x14,0x22,0x41], L: [0x7F,0x40,0x40,0x40,0x40], M: [0x7F,2,0x0C,2,0x7F], N: [0x7F,4,8,0x10,0x7F], O: [0x3E,0x41,0x41,0x41,0x3E],
  P: [0x7F,9,9,9,6], Q: [0x3E,0x41,0x51,0x21,0x5E], R: [0x7F,9,0x19,0x29,0x46], S: [0x46,0x49,0x49,0x49,0x31], T: [1,1,0x7F,1,1],
  U: [0x3F,0x40,0x40,0x40,0x3F], V: [0x1F,0x20,0x40,0x20,0x1F], W: [0x3F,0x40,0x38,0x40,0x3F], X: [0x63,0x14,8,0x14,0x63], Y: [7,8,0x70,8,7], Z: [0x61,0x51,0x49,0x45,0x43],
  a: [0x20,0x54,0x54,0x54,0x78], b: [0x7F,0x48,0x44,0x44,0x38], c: [0x38,0x44,0x44,0x44,0x20], d: [0x38,0x44,0x44,0x48,0x7F], e: [0x38,0x54,0x54,0x54,0x18],
  f: [8,0x7E,9,1,2], g: [0x0C,0x52,0x52,0x52,0x3E], h: [0x7F,8,4,4,0x78], i: [0,0x44,0x7D,0x40,0], j: [0x20,0x40,0x44,0x3D,0],
  k: [0x7F,0x10,0x28,0x44,0], l: [0,0x41,0x7F,0x40,0], m: [0x7C,4,0x18,4,0x78], n: [0x7C,8,4,4,0x78], o: [0x38,0x44,0x44,0x44,0x38],
  p: [0x7C,0x14,0x14,0x14,8], q: [8,0x14,0x14,0x18,0x7C], r: [0x7C,8,4,4,8], s: [0x48,0x54,0x54,0x54,0x20], t: [4,0x3F,0x44,0x40,0x20],
  u: [0x3C,0x40,0x40,0x20,0x7C], v: [0x1C,0x20,0x40,0x20,0x1C], w: [0x3C,0x40,0x30,0x40,0x3C], x: [0x44,0x28,0x10,0x28,0x44], y: [0x0C,0x50,0x50,0x50,0x3C], z: [0x44,0x64,0x54,0x4C,0x44],
};
// signal-strength glyphs ..: five rising bars
for (let n = 0; n <= 5; n++) G[String.fromCharCode(0xE000 + n)] = [0,1,2,3,4].map(i => { const h = 2 + i; return i < n ? ((1 << h) - 1) << (7 - h) : 0; });
const SIG = n => String.fromCharCode(0xE000 + Math.max(0, Math.min(5, Math.round(n))));

// The intro every variant uses: segment test → the LW 171 kHz frame from the photo → seek → station ID

  await wait(350);
  vfd.fill(1); await wait(420); vfd.fill(0); await wait(260);           // power-on segment test
  vfd.write(1, 'LW       171 kHz'); await wait(1100);                    // homage to the photo
  vfd.write(0, 'HELLO'); await wait(800);
  vfd.write(0, 'SEEK ►'); vfd.write(1, 'FM1     87.5MHz'); Sound.set(.8);

    if (e.key === 'Home') scrollBy(-1e6); if (e.key === 'End') scrollBy(1e6);
    if (e.key === 'Tab') { e.preventDefault(); const links = G.regions.filter(g => g.r >= L().top && g.r < G.rows - 1); if (!links.length) return;
      let i = S.focus ? links.findIndex(g => g.r === S.focus.r && g.c0 === S.focus.c0) : -1; i = (i + (e.shiftKey ? -1 : 1) + links.length) % links.length; S.focus = links[i]; compose(); }
    if (e.key === 'Enter' && S.focus) open(S.focus.href);
    if (e.key === 'Escape' && S.sub) location.hash = S.st.id;
  });

  async function tune(st, sub) {
    renderState(st); sr.innerHTML = renderStation(st, sub); sr.querySelectorAll('a').forEach(a => a.tabIndex = -1);
    S.focus = null;
    if (S.st === st) { S.sub = sub; S.scroll = 0; layout(); compose(); return; }
    const from = S.st ? S.st.freq : S.freq; S.seekLabel = st.freq >= from ? 'SEEK ►' : '◄ SEEK'; S.noise = true; Sound.click();
    await animateFreq(from, st.freq, 480, f => { S.freq = f; Sound.tune(Math.abs(f - st.freq)); compose(); });
    S.seekLabel = null; S.noise = false; Sound.quiet(); Sound.chime(st); S.st = st; S.sub = sub; S.freq = st.freq; S.scroll = 0; layout(); compose();
  }

  // ---- intro: the receiver finds the channel ----
  const I = {};
  const tween = (ms, fn = () => {}) => new Promise(res => { const t0 = performance.now(); const step = () => { const t = skipping ? 1 : Math.min(1, (performance.now() - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(step) : res(); }; step(); });
  const NAME = 'Jasper Lutz Severino', JUNK = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#*';
  const nearest = f => STATIONS.reduce((x, s) => Math.abs(s.freq - f) < Math.abs(x.freq - f) ? s : x);
  function paintIntro(a) {
    if (I.all) return a.allOn(I.all);
    if (I.standby) { // a head unit in standby shows only its clock, dimmed
      const d = new Date(), t = `${String(d.getHours()).padStart(2, '0')}${d.getSeconds() % 2 ? ':' : ' '}${String(d.getMinutes()).padStart(2, '0')}`, s = Math.max(1, Math.min(4, Math.floor(a.cols * 5 / 34 / 2)));
      a.bigText(t, s, Math.floor((a.cols * 5 - 30 * s) / 2), (a.mid - 3) * 8, .2, 0, a.rows - 1);
      const m = 'press any key to power on'; a.put(Math.floor((a.cols - m.length) / 2), a.mid + 3, m, .16);
      return;
    }
    if (I.header != null) a.header(I.header, I.label, I.locked, I.sig);
    if (I.bar) a.channelBar(I.bar);
    if (I.bigFreq) a.bigText(fmtF(I.bigFreq.f).padStart(5), I.bigFreq.s, a.lay.left * 5, a.lay.top * 8, 1, 0, a.rows - 2, I.bigFreq);
    if (I.big) a.bigText('JASPER', I.big.s, a.lay.left * 5, a.lay.top * 8, 1, 0, a.rows - 2, I.big);
    if (I.caught) a.put(a.lay.left, I.nameRow, `${I.caught.ps}  ${fmtF(I.caught.freq)}`, .5);
    if (I.decode) { const { text, order, t } = I.decode; a.put(a.lay.left, I.nameRow, [...text].map((ch, i) => ch === ' ' || t >= order[i] ? ch : JUNK[Math.floor(Math.random() * JUNK.length)]).join(''), 1); }
    if (I.name != null) a.put(a.lay.left, I.nameRow, NAME.slice(0, I.name), 1);
  }
  async function standby() {
    I.standby = true; introActive = false;
    await new Promise(res => { const go = e => { if (e.target.closest && e.target.closest('#proto-bar')) return; if (e.key && ['ArrowLeft', 'ArrowRight'].includes(e.key)) return; removeEventListener('keydown', go); removeEventListener('pointerdown', go); res(); }; addEventListener('keydown', go); addEventListener('pointerdown', go); });
    Sound.enable(true); // the visitor pressed power: that gesture is what lets the browser play sound
    I.standby = false; await tween(120); introActive = true;
  }
  async function seek(k, target) {
    await tween(cfg.power === 'button' ? 300 : 900);           // a moment fully off: only the cover, its scratches and reflections
    Sound.power();
    await tween(450, t => { V.filGlow = Math.sin(t * Math.PI / 2) * .9; V.dirty = true; });   // filaments warm up
    I.all = 1; await tween(240); I.all = 0;                                                 // self-test
    tween(500, t => { V.filGlow = .9 * (1 - t); V.dirty = true; });
    await tween(150);
    let f = 107.9; Object.assign(I, { header: f, label: '◄ SEEK', locked: false, sig: 1, bigFreq: { s: k.bigS, f }, nameRow: k.nameRow });
    for (const st of [...STATIONS].reverse().filter(s => s.freq >= target.freq)) { // seek down the band, catching each channel
      const from = f;
      await tween(Math.max(180, (from - st.freq) * 60), t => { f = from + (st.freq - from) * ease(t); const fr = Math.round(f * 10) / 10, dd = Math.abs(fr - nearest(fr).freq);
        I.header = fr; I.bigFreq.f = fr; I.sig = Math.max(1, Math.round(5 - dd * 4)); Sound.tune(dd); });
      f = st.freq;
      if (st === target) break;
      I.caught = st; I.sig = 4; Sound.quiet(); Sound.blip(st); await tween(220); I.caught = null;
    }
    // lock: stereo, then the station name decodes from the RDS data
    Sound.quiet(); Sound.chime(target);
    Object.assign(I, { label: null, locked: true, sig: 5, decode: { text: target.id === 'home' ? NAME : target.title, order: [...NAME, ...target.title].map(() => Math.random() * .85), t: 0 } });
    await tween(650, t => { I.decode.t = t; });
    await tween(450, t => { I.bigFreq.p = 1 - t; if (target.id === 'home') I.big = { s: k.bigS, p: t }; });
    Object.assign(I, { bigFreq: null, decode: null, big: target.id === 'home' ? { s: k.bigS } : null, name: target.id === 'home' ? NAME.length : null });
    for (let i = 1; i <= STATIONS.length; i++) { I.bar = i; Sound.click(.5); await tween(90); }
    S.painter = null; S.freq = target.freq; S.reveal = target.id === 'home' ? k.nameIdx + 1 : 0; compose();
    while (S.reveal < S.lines.length && !skipping) { S.reveal++; compose(); await wait(35); }
    S.reveal = Infinity; compose();
  }

  return {
    async start() {
      build(); const r = route(), target = r.st || byId('home');
      S.st = byId('home'); layout();
      const lay = L(), nameIdx = S.lines.findIndex(l => l.segs.some(x => x.t === 'Jasper'));
      const k = { lay, bigS: S.lines[0].big.s, nameIdx, nameRow: lay.top + nameIdx };
      S.st = target; S.sub = r.sub; layout();     // a deep link seeks straight to its own channel
      S.painter = paintIntro;
      if (cfg.power === 'button') await standby();
      await seek(k, target);
      S.painter = null; S.freq = target.freq; S.reveal = Infinity; V.filGlow = 0; V.dirty = true; compose();
      renderState(S.st); sr.innerHTML = renderStation(S.st, S.sub);
    },
    onRoute() { const r = route(); tune(r.st || byId('home'), r.sub); },
  };
}

/* =====================================================================
   Variant switcher + boot
   ===================================================================== */
const VARIANTS = {
  crt:  ['Bulging glass, like a CRT', { k: .1, scale: .93, radius: .09, tilt: [0, 0], follow: 1.6, lip: 0, house: 9, led: 0, power: 'auto' }],
  bowl: ['Concave, set into the housing · power button', { k: -.06, scale: .9, radius: .06, tilt: [0, 0], follow: 1.6, lip: .12, house: 9, led: 1, power: 'button' }],
  dash: ['In the dashboard, seen from below', { k: .05, scale: .8, radius: .05, tilt: [-7, 9], follow: 2.5, lip: .05, house: .2, led: 1, power: 'auto' }],
  flat: ['Round 2 acrylic, flat, new intro', { k: 0, scale: 1, radius: 0, tilt: [0, 0], follow: 0, lip: 0, house: 9, led: 0, power: 'auto' }],
};
const keyHandlers = []; const onKey = f => keyHandlers.push(f);
const params = new URLSearchParams(location.search);
const vKey = VARIANTS[params.get('variant')] ? params.get('variant') : 'crt';
const cfg = { ...VARIANTS[vKey][1] };
for (const k of ['k', 'follow', 'scale']) if (params.has(k)) cfg[k] = +params.get(k);      // tweak: ?k=.14&follow=3
if (params.get('power')) cfg.power = params.get('power');                                  // ?power=button|auto
function go(dir) {
  const ks = Object.keys(VARIANTS); const k = ks[(ks.indexOf(vKey) + dir + ks.length) % ks.length];
  for (const x of ['k', 'follow', 'scale', 'power']) params.delete(x);
  params.set('variant', k); location.href = location.pathname + '?' + params.toString() + location.hash;
}
function renderState(st) {
  const el = document.getElementById('pb-state'); if (!el) return;
  const r = route();
  el.textContent = `curve ${cfg.k} · power ${cfg.power} · ` + (st ? `${fmtF(st.freq)} ${st.ps}${r.sub ? '/' + r.sub : ''}` : 'intro') + (Sound.on ? ' · sound' : '');
}
if (params.get('bar') !== '0') {
  const bar = document.getElementById('proto-bar'); bar.hidden = false;
  document.getElementById('pb-label').textContent = `${vKey} (${VARIANTS[vKey][0]})`;
  document.getElementById('pb-prev').onclick = () => go(-1); document.getElementById('pb-next').onclick = () => go(1);
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (!e.metaKey && !e.ctrlKey && !['ArrowLeft', 'ArrowRight'].includes(e.key)) skipIntro();
  if (e.key === 'ArrowLeft') return go(-1);
  if (e.key === 'ArrowRight') return go(1);
  keyHandlers.forEach(f => f(e));
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#proto-bar')) skipIntro(); }, { capture: true });
const variant = Receiver(document.getElementById('app'), cfg);
renderState(null);
variant.start().then(() => { introActive = false; skipping = false; skipHooks.clear(); window.addEventListener('hashchange', () => variant.onRoute()); if (location.hash) variant.onRoute(); });
</script>
</body>
