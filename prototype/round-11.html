<!doctype html>
<!--
  PROTOTYPE — throwaway, round 11. Earlier rounds: round-1..round-10.html. Settled: full-screen receiver, acrylic cover,
  subtle curve, centered poster, reception, paged name, typed log with oblique copy, channels spelling DIAL in ASCII,
  intro on every page (only home's sweep stops at each channel), projects as split, the blog as the wire (posts print).
  Question now: "How should the wire list each post, and with how much space?" No header line any more; titles come first;
  dates read as 28 OCT 2026; the list shares the post's text column; the selection marker sits in the margin.
    stack    title, then one quiet line: date · tags · reading time; one blank row between posts
    columns  one row per post: title left, date right; posts grouped under their year
    digest   title with its date on the right, the summary below it; two blank rows between posts
  Keys: up/down or Tab select, Enter opens, Esc goes back. (Left/right are the prototype bar's.)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · receiver · round 11</title>
<style>
  :root {
    --phosphor: #e6fbff;
    --glow: 120, 220, 255;
    --ink: #d9dee2;
    --dim: #7c868d;
    --bg: #050607;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; }
  a { color: rgb(var(--glow)); }

  /* ---------- VFD (shared component) ---------- */
  .vfd { position: relative; display: inline-block; line-height: 0; }
  .vfd-window {
    position: relative; overflow: hidden; border-radius: 3px;
    background:
      radial-gradient(120% 140% at 50% 55%, #0b1417 0%, #070c0e 55%, #040607 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), inset 0 2px 8px rgba(0,0,0,.9);
  }
  .vfd canvas { display: block; width: 100%; height: auto; }
  .vfd canvas.lit {
    position: absolute; inset: 0;
    filter:
      drop-shadow(0 0 1px rgba(200, 245, 255, .95))
      drop-shadow(0 0 4px rgba(var(--glow), .6))
      drop-shadow(0 0 12px rgba(var(--glow), .28));
    animation: vfd-flicker 7s infinite steps(1);
  }
  @keyframes vfd-flicker {
    0%, 100% { opacity: 1; } 31% { opacity: .94; } 31.6% { opacity: 1; }
    64% { opacity: .97; } 64.4% { opacity: 1; } 88% { opacity: .95; } 88.3% { opacity: 1; }
  }
  /* control grid mesh sits just above the anodes: darkens lit dots in a fine weave */
  .vfd-mesh {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.42) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
  }
  /* filament wires: a few hair-thin horizontal lines across the whole tube */
  .vfd-filaments {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, transparent 0 calc(var(--fil, 18px) - 1px), rgba(0,0,0,.55) calc(var(--fil, 18px) - 1px) var(--fil, 18px));
    opacity: .7;
  }
  .vfd-glass {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(172deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.015) 28%, transparent 46%),
      radial-gradient(40% 30% at 72% 78%, rgba(255,255,255,.035), transparent 70%);
  }
  .vfd-ann { position: absolute; left: 0; top: 0; display: flex; gap: .5em; padding: .35em .6em;
    font: 700 9px/1 var(--sans); letter-spacing: .08em; line-height: 1; z-index: 2; pointer-events: none; }
  .vfd-ann span { color: rgba(150, 210, 235, .10); transition: color .15s, text-shadow .15s; }
  .vfd-ann span.on { color: var(--phosphor); text-shadow: 0 0 2px rgba(200,245,255,.9), 0 0 8px rgba(var(--glow),.6); }

  /* static noise overlay used for transitions */
  .static-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; image-rendering: pixelated; mix-blend-mode: screen; }

  /* ---------- content (shared typography) ---------- */
  .content { font-size: 17px; line-height: 1.65; }
  .content h1 { font: 600 clamp(32px, 5vw, 52px)/1.05 var(--sans); letter-spacing: -.02em; margin: .2em 0 .35em; color: #f2f5f7; }
  .content h2 { font: 600 22px/1.25 var(--sans); margin: 1.6em 0 .5em; color: #eef2f4; }
  .content p { margin: 0 0 1em; }
  .content .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--glow)); opacity: .85; }
  .content .lede { font-size: 20px; color: #c3cad0; max-width: 34em; }
  .content .muted { color: var(--dim); }
  .content code { font-family: var(--mono); font-size: .88em; background: #11171a; padding: .1em .35em; border-radius: 3px; }
  .content pre { background: #0c1113; border: 1px solid #172126; padding: 14px 16px; border-radius: 6px; overflow-x: auto; }
  .content pre code { background: none; padding: 0; }
  .content article { font-family: var(--serif); font-size: 19px; }
  .content article h1, .content article h2 { font-family: var(--sans); }
  .c-index { list-style: none; padding: 0; margin: 1.6em 0 0; border-top: 1px solid #1a2226; }
  .c-index a { display: grid; grid-template-columns: 5.5em 9em 1fr; gap: 1em; padding: .8em .2em; border-bottom: 1px solid #1a2226; color: inherit; text-decoration: none; align-items: baseline; }
  .c-index a:hover { background: #0b1013; }
  .c-index .f { font-family: var(--mono); color: rgb(var(--glow)); }
  .c-index .n { font-weight: 600; color: #eef2f4; }
  .c-index .d { color: var(--dim); }
  .c-posts { list-style: none; padding: 0; margin: 1em 0; }
  .c-posts li { padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-posts a { font-weight: 600; font-size: 20px; color: #eef2f4; text-decoration: none; }
  .c-posts a:hover { color: rgb(var(--glow)); }
  .c-posts .meta { font: 12px/1.4 var(--mono); color: var(--dim); letter-spacing: .05em; }
  .c-projects { display: grid; gap: 0; margin-top: 1em; }
  .c-projects .p { display: grid; grid-template-columns: 11em 1fr; gap: 1.2em; padding: 1em 0; border-bottom: 1px solid #1a2226; }
  .c-projects .p b { color: #eef2f4; }
  .c-projects .p a { font: 12px var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .c-index a { grid-template-columns: 4.5em 1fr; } .c-index .d { grid-column: 2; }
    .c-projects .p { grid-template-columns: 1fr; gap: .2em; }
  }

  /* ---------- prototype switcher (not part of the design) ---------- */
  #proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
    background: #fff; color: #111; font: 600 13px/1 var(--sans); box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 2px #ff3d7f; }
  #proto-bar button { border: 0; background: #eee; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
  #proto-bar button:hover { background: #ddd; }
  #proto-bar .lbl { padding: 0 10px; white-space: nowrap; }
  #proto-bar .state { font: 500 11px var(--mono); color: #666; padding-right: 10px; border-left: 1px solid #ddd; padding-left: 10px; white-space: nowrap; }
  @media (max-width: 700px) { #proto-bar { left: 8px; right: 8px; transform: none; border-radius: 18px; line-height: 1.3; } #proto-bar .lbl, #proto-bar .state { white-space: normal; font-size: 11px; } }

  /* ---------- round 4: the receiver is one WebGL canvas ---------- */
  .vd { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; background: #030303; }
  .vd canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; animation: vfd-flicker3 7s infinite steps(1); }
  @keyframes vfd-flicker3 { 0%, 100% { opacity: 1; } 31% { opacity: .975; } 31.6% { opacity: 1; } 64% { opacity: .985; } 64.4% { opacity: 1; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

<script>
/* =====================================================================
   Content (placeholder unless noted)
   ===================================================================== */
const STATIONS = [
  { id: 'home',     preset: 1, freq: 100.0, ps: 'JASPER',   title: 'Station ID', blurb: 'Who is broadcasting',
    rt: 'JASPER LUTZ SEVERINO' },
  { id: 'projects', preset: 2, freq: 105.0, ps: 'PROJECTS', title: 'Projects',   blurb: 'Things I build and run',
    rt: 'PROJECTS  *  REPO STANDARDS ON AIR  *  REPO CANON, SCRIPTORIUM, POSTERN...' },
  { id: 'blog',     preset: 3, freq: 97.0,  ps: 'BLOG',     title: 'Blog',       blurb: 'Long-form writing, in Markdown',
    rt: '' /* filled from latest post */ },
  { id: 'contact',  preset: 4, freq: 108.0, ps: 'CONTACT',  title: 'Contact',    blurb: 'How to reach me',
    rt: 'CONTACT  *  GITHUB.COM/LUTZSEVERINO' },
];
// "About" is no longer a channel: it is told on the home screen, typed through the static, on its own.
// PLACEHOLDER copy: replace with your own words. Two sets to compare (C key or ?copy=). No servers, no hardware.
const COPY = {
  oblique: [
    'if this is reaching anyone, stay a moment.',
    "i can't speak the way i used to. this works, mostly.",
    'i spent my time making things easier for the people who make things.',
    'most of it is still out there, running without me.',
    'the rest is further along the dial.',
  ],
  sparse: [
    'hello?',
    'still here. somewhere.',
    'i fixed things nobody saw break.',
    'some of them are still running.',
    'keep turning.',
  ],
};
const tx = () => COPY[cfg.copy] || COPY.oblique;

// Projects come from each repository's README (title, tagline, stack badges, lead paragraphs) plus GitHub metadata:
// see projects.js, generated at build time in the real site. Only what a README cannot say lives here.
const PROJECT_EXTRA = {
  'repo-standards': { logo: 'assets/repo-standards-512.png', featured: true },   // featured: "on air" now (could also drive a home announcement)
};
const PROJECTS = (window.PROJECT_DATA || []).map(p => ({ ...p, ...(PROJECT_EXTRA[p.id] || {}), ps: p.name.toUpperCase().slice(0, 8) }));

// Posts are Markdown files with front matter (posts/*.md), bundled at build time into posts.js. Dropping a file in publishes it.
function parsePost(file, raw) {
  const m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/) || [null, '', raw], fm = {};
  for (const l of m[1].split('\n')) { const i = l.indexOf(':'); if (i > 0) fm[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }
  const md = m[2].trim(), words = md.replace(/```[\s\S]*?```/g, '').split(/\s+/).length;
  return { slug: file.replace(/\.md$/, ''), title: fm.title || file, date: fm.date || '', summary: fm.summary || '', md,
    tags: (fm.tags || '').replace(/^\[|\]$/g, '').split(',').map(t => t.trim()).filter(Boolean), mins: Math.max(1, Math.round(words / 200)), secs: Math.max(10, Math.round(words / 200 * 60)) };
}
const POSTS = Object.entries(window.POST_FILES || {}).map(([f, raw]) => parsePost(f, raw)).sort((x, y) => y.date.localeCompare(x.date));
STATIONS.find(s => s.id === 'blog').rt = `BLOG  *  LATEST: ${POSTS[0].title.toUpperCase()}`;

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(src) { // tiny Markdown → HTML, enough for the prototype
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  const out = []; const blocks = src.split(/\n\n+/);
  for (let i = 0; i < blocks.length; i++) {
    let b = blocks[i];
    if (b.startsWith('```')) {
      while (!b.trimEnd().endsWith('```') || b.trim() === '```') { if (i + 1 >= blocks.length) break; b += '\n\n' + blocks[++i]; }
      out.push(`<pre><code>${esc(b.replace(/^```\w*\n?/, '').replace(/\n?```\s*$/, ''))}</code></pre>`);
    } else if (/^> /.test(b)) out.push(`<blockquote>${inline(b.replace(/^> ?/gm, ''))}</blockquote>`);
    else if (/^## /.test(b)) out.push(`<h2>${inline(b.slice(3))}</h2>`);
    else if (/^# /.test(b)) out.push(`<h1>${inline(b.slice(2))}</h1>`);
    else if (/^- /.test(b)) out.push('<ul>' + b.split('\n').map(l => `<li>${inline(l.replace(/^- /, ''))}</li>`).join('') + '</ul>');
    else out.push(`<p>${inline(b)}</p>`);
  }
  return out.join('\n');
}

const fmtF = f => f.toFixed(1);
function renderStation(st, sub) {
  if (!st) return '';
  switch (st.id) {
    case 'home': return `
      <p class="kicker">${fmtF(st.freq)} FM · station ID</p>
      <h1>Jasper Lutz Severino</h1>
      <ol>${tx().map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <ul class="c-index">${STATIONS.filter(s => s.id !== 'home').map(s =>
        `<li><a href="#${s.id}"><span class="f">${fmtF(s.freq)}</span><span class="n">${s.title}</span><span class="d">${s.blurb}</span></a></li>`).join('')}</ul>`;
    case 'about': return `
      <p class="kicker">${fmtF(st.freq)} FM · about</p>
      <h1>About</h1>
      <p class="lede">Placeholder. I build tools for maintainers and the machines that run them.</p>
      <p>Write the longer version here: what you do, what you're curious about, what you're tuning into lately. This is a plain page, so it can be as long as it needs to be.</p>
      <p class="muted">Everything on this channel is placeholder copy.</p>`;
    case 'projects': {
      const p = sub && PROJECTS.find(x => x.id === sub);
      if (p) return `
      <p class="kicker"><a href="#projects">All projects</a></p>
      <h1>${esc(p.name)}</h1><p class="lede">${esc(p.tagline)}</p>
      <p>${esc(p.stack.join(' · '))} · since ${p.since}</p>
      <p>${p.site ? `<a href="${p.site}">Visit the site</a> · ` : ''}${p.private ? 'Private source' : `<a href="${p.repo}">Source</a>`}</p>
      ${p.lead.map(l => `<p>${esc(l).replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')}</p>`).join('')}`;
      return `
      <p class="kicker">${fmtF(st.freq)} FM · projects</p>
      <h1>Projects</h1>
      <ul>${PROJECTS.map(x => `<li><a href="#projects/${x.id}">${esc(x.name)}</a>: ${esc(x.tagline)}</li>`).join('')}</ul>`;
    }
    case 'blog': {
      const post = sub && POSTS.find(p => p.slug === sub);
      if (post) return `
        <p class="kicker"><a href="#blog">← ${fmtF(st.freq)} FM · blog</a></p>
        <article><h1>${esc(post.title)}</h1><p class="muted" style="font:13px var(--mono)">${post.date}</p>${md(post.md)}</article>`;
      return `
        <p class="kicker">${fmtF(st.freq)} FM · blog</p>
        <h1>Blog</h1>
        <ul class="c-posts">${POSTS.map(p => `<li><div class="meta">${p.date}</div><a href="#blog/${p.slug}">${esc(p.title)}</a><div class="muted">${esc(p.summary)}</div></li>`).join('')}</ul>`;
    }
    case 'contact': return `
      <p class="kicker">${fmtF(st.freq)} FM · contact</p>
      <h1>Contact</h1>
      <p class="lede">The fastest way to reach me is <a href="https://github.com/lutzseverino">github.com/lutzseverino</a>.</p>
      <p class="muted">Placeholder: add email or other channels here.</p>`;
  }
}

const byId = id => STATIONS.find(s => s.id === id);

  await wait(350);
  vfd.fill(1); await wait(420); vfd.fill(0); await wait(260);           // power-on segment test
  vfd.write(1, 'LW       171 kHz'); await wait(1100);                    // homage to the photo
  vfd.write(0, 'HELLO'); await wait(800);
  vfd.write(0, 'SEEK ►'); vfd.write(1, 'FM1     87.5MHz'); Sound.set(.8);
  await animateFreq(87.5, byId('home').freq, 900, f => { vfd.write(1, freqLine(f)); onFreq && onFreq(f); });

    G.regions = regions;
  }
  function drawCell(k) {
    const { cols, p } = G, [x, y] = cellXY(k % cols, (k / cols) | 0), s = p * .8, base = k * 40, b = G.bri[k];
    lctx.clearRect(x - .5, y - .5, G.cw + 1, G.chh + 1);
    for (let i = 0; i < 40; i++) { const l = G.lvl[base + i]; if (l > 0) { lctx.globalAlpha = l * b; lctx.fillRect(x + ((i / 8) | 0) * p, y + (i % 8) * p, s, s); } }
    lctx.globalAlpha = 1; V.litDirty = true;
  }
  let pointer = [0, 0];
  addEventListener('pointermove', e => { pointer = [e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1]; });
  DISPLAYS.add({ el: wrap, tick(now) {
    if (!G || !scr) return; const { tgt, lvl, active } = G;
    for (const k of active) {
      let moving = false;
      for (let i = k * 40; i < k * 40 + 40; i++) { const t = tgt[i], l = lvl[i];
        if (t) { if (l < 1) { const nl = l + (1 - l) * .6; lvl[i] = nl > .995 ? 1 : nl; moving = true; } }
        else if (l > 0) { const nl = l * .42; lvl[i] = nl < .03 ? 0 : nl; moving = true; } }
      drawCell(k); if (!moving) active.delete(k);
    }
    if (S.painter || S.noise || P.busy() || B.busy()) compose();
    else if (isBlog()) { const k = Math.floor(performance.now() / 240); if (k !== V.bk) { V.bk = k; compose(); } }   // clock and blinking heads
    else if (H.anim && isHome() && !S.noise) {   // live home bodies redraw only when they change: needle moving, spectrum tick, radiotext step
      const hk = H.key ? H.key() : 0; if (hk !== V.hk || (H.busy && H.busy())) { V.hk = hk; compose(); } }
    // the cover sits in front of the dots: it and its reflections shift a little as the viewer moves
    const nx = V.px + (pointer[0] - V.px) * .06, ny = V.py + (pointer[1] - V.py) * .06;
    if (Math.abs(nx - V.px) + Math.abs(ny - V.py) > .0005) { V.px = nx; V.py = ny; V.dirty = true; }
    if (V.litDirty) { scr.upload(0, lC); V.litDirty = false; V.lightPending = true; V.dirty = true; }
    if (V.lightPending && now - V.lightAt > 80) { V.lightAt = now; V.lightPending = false; relight(); V.dirty = true; }
    if (V.dirty) {
      scr.draw({ W: G.W, H: G.H, fil: V.fil, off: [V.px * -.0015, V.py * -.0015], refOff: [V.px * -.012, V.py * -.008] });
      V.dirty = false;
    }
  } });

  // --- input ---
  const regionAt = (x, y) => { const [dx, dy] = toDisplay(x, y), c = Math.floor((dx - G.ox) / (G.cw + G.gx)), r = Math.floor((dy - G.oy) / (G.chh + G.gy)); return G.regions.find(g => g.r === r && c >= g.c0 && c <= g.c1); };
  const open = href => {
    if (href.startsWith('p:')) return P.act(href.slice(2));
    if (href === 'tt:prev') return B.pageScroll(-1); if (href === 'tt:next') return B.pageScroll(1);
    if (href === 'sound:') { Sound.toggle(); if (Sound.on) Sound.chime(S.st); renderState(S.st); compose(); return; }
    href.startsWith('#') ? (location.hash = href.slice(1)) : window.open(href, '_blank', 'noopener');
  };
  const scrollBy = d => { if (B.pageScroll(d)) return; const max = Math.max(0, S.lines.length - L().view), ns = Math.max(0, Math.min(max, S.scroll + d)); if (ns !== S.scroll) { S.scroll = ns; S.focus = null; compose(); } };
  let drag = null;
  wrap.addEventListener('pointerdown', e => { drag = { y: e.clientY, moved: false }; });
  wrap.addEventListener('pointerup', e => { if (drag && !drag.moved && !S.painter) { const g = regionAt(e.clientX, e.clientY); if (g) open(g.href); else if (isHome()) H.listen(); } drag = null; });
  wrap.addEventListener('pointermove', e => {
    if (!G) return;
    if (drag) { const rowH = G.chh + G.gy, d = drag.y - e.clientY; if (Math.abs(d) > rowH) { drag.moved = true; scrollBy(Math.trunc(d / rowH)); drag.y = e.clientY; } return; }
    const g = S.painter ? null : regionAt(e.clientX, e.clientY), h = g ? g.href : null; wrap.style.cursor = g ? 'pointer' : 'default';
    if (h !== S.hover) { if (g && g.sel != null) (isBlog() ? B : P).hoverSel(g.sel); S.hover = h; compose(); }
  });
  wrap.addEventListener('wheel', e => { e.preventDefault(); scrollBy(Math.sign(e.deltaY) * 3); }, { passive: false });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); compose(); }, 150); });
  onKey(e => {
    if (S.painter) return;
    if (P.key(e) || B.key(e)) return;
    if (/^[1-9]$/.test(e.key) && STATIONS[+e.key - 1]) location.hash = STATIONS[+e.key - 1].id;
    if (e.key === 'm') open('sound:');
    const v = L().view;
    if (e.key === 'ArrowDown') scrollBy(1); if (e.key === 'ArrowUp') scrollBy(-1);
    if (e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); scrollBy(v - 1); } if (e.key === 'PageUp') scrollBy(1 - v);
    if (e.key === 'Home') scrollBy(-1e6); if (e.key === 'End') scrollBy(1e6);
    if (e.key === 'Tab') { e.preventDefault(); const links = G.regions.filter(g => !g.nofocus && g.r >= L().top && g.r < G.rows - 1); if (!links.length) return;
      let i = S.focus ? links.findIndex(g => g.r === S.focus.r && g.c0 === S.focus.c0) : -1; i = (i + (e.shiftKey ? -1 : 1) + links.length) % links.length; S.focus = links[i]; compose(); }
    if (e.key === 'Enter' && S.focus) open(S.focus.href); else if (e.key === 'Enter' && isHome()) H.listen();
    if (e.key === 'Escape' && S.sub) location.hash = S.st.id;
  });

  async function tune(st, sub) {
    renderState(st); sr.innerHTML = renderStation(st, sub); sr.querySelectorAll('a').forEach(a => a.tabIndex = -1);
    S.focus = null;
    if (S.st === st) { const prev = S.sub; S.sub = sub; S.scroll = 0; layout(); if (st.id === 'projects') P.onSub(prev, sub); if (st.id === 'blog') B.onSub(prev, sub); compose(); return; }
    PJ.open = PJ.close = null; BJ.open = BJ.close = null;
    const from = S.st ? S.st.freq : S.freq; S.seekLabel = st.freq >= from ? 'SEEK ►' : '◄ SEEK'; S.noise = true; Sound.click();
    await animateFreq(from, st.freq, 480, f => { S.freq = f; Sound.tune(Math.abs(f - st.freq)); compose(); });
    S.seekLabel = null; S.noise = false; Sound.quiet(); Sound.chime(st); S.st = st; S.sub = sub; S.freq = st.freq; S.scroll = 0; layout();
    if (isHome() && H.onEnter) H.onEnter(); compose();
  }

  // ---- intro: the receiver finds the channel, then lands on the variant's own home layout ----
  const I = {};
  const tween = (ms, fn = () => {}) => new Promise(res => { const t0 = performance.now(); const step = () => { const t = skipping ? 1 : Math.min(1, (performance.now() - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(step) : res(); }; step(); });
  const JUNK = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#*';
  const nearest = f => STATIONS.reduce((x, s) => Math.abs(s.freq - f) < Math.abs(x.freq - f) ? s : x);
  const mark = id => { I.marks.add(id); M.rise[id] = performance.now(); };
  function paintIntro(a) {
    if (I.all) return a.allOn(I.all);
    if (I.standby) { // a head unit in standby shows only its clock, dimmed
      const d = new Date(), t = `${String(d.getHours()).padStart(2, '0')}${d.getSeconds() % 2 ? ':' : ' '}${String(d.getMinutes()).padStart(2, '0')}`, s = Math.max(1, Math.min(4, Math.floor(a.cols * 5 / 34 / 2)));
      a.bigText(t, s, Math.floor((a.cols * 5 - 30 * s) / 2), (a.mid - 3) * 8, .2, 0, a.rows - 1);
      const m = 'press any key to power on'; a.put(Math.floor((a.cols - m.length) / 2), a.mid + 3, m, .16);
      return;
    }
    if (I.header != null) a.header(I.header, I.label, I.locked, I.sig);
    if (I.bar && H.bar !== false) a.channelBar(I.bar);
    if (I.body) H.paint(a, I);
  }
  async function standby() {
    I.standby = true; introActive = false;
    await new Promise(res => { const go = e => { if (e.target.closest && e.target.closest('#proto-bar')) return; if (e.key && ['ArrowLeft', 'ArrowRight'].includes(e.key)) return; removeEventListener('keydown', go); removeEventListener('pointerdown', go); res(); }; addEventListener('keydown', go); addEventListener('pointerdown', go); });
    Sound.enable(true); // the visitor pressed power: that gesture is what lets the browser play sound
    I.standby = false; await tween(120); introActive = true;
  }
  async function seek(target) {
    const home = target.id === 'home';
    await tween(cfg.power === 'button' ? 300 : 900);           // a moment fully off: only the cover, its scratches and reflections
    Sound.power();
    await tween(250);
    I.all = 1; await tween(240); I.all = 0;                     // self-test: the whole tube flashes
    await tween(220);
    // home sweeps the whole band, catching every channel; any other page tunes straight to its own, the same 4 MHz for each
    let f = home ? 108.0 : target.freq + 4 > 108 ? target.freq - 4 : target.freq + 4;
    Object.assign(I, { body: true, header: f, label: '◄ SEEK', locked: false, sig: 1, big: [{ text: fstr(f), freq: true }], name: null, reveal: 0, f, marks: new Set(), scope: true, boxes: 5, scan: null, mq: null });
    if (H.scan) { // memory scan: each preset plays for a moment, landing on the target
      I.label = 'P.SCAN';
      const order = [...STATIONS.slice(STATIONS.indexOf(target) + 1), ...STATIONS.slice(0, STATIONS.indexOf(target))];
      for (const st of order) {
        Object.assign(I, { scan: STATIONS.indexOf(st), header: st.freq, big: [{ text: fstr(st.freq) }], sig: 4, name: { t: `P${st.preset}  ${st.ps}`, b: .5 } });
        Sound.click(.6); Sound.tune(.4); await tween(70); Sound.quiet(); Sound.blip(st); await tween(300);
      }
      Object.assign(I, { scan: STATIONS.indexOf(target), header: target.freq, big: [{ text: fstr(target.freq) }], name: null }); Sound.click(.6);
    } else if (!home) {
      const from = f;
      await tween(760, t => { f = from + (target.freq - from) * ease(t); const fr = Math.round(f * 10) / 10, dd = Math.abs(fr - target.freq);
        I.header = fr; I.f = fr; I.big = [{ text: fstr(fr), freq: true }]; I.sig = Math.max(1, Math.round(5 - dd * 4)); Sound.tune(dd); });
      f = target.freq;
    } else {
      for (const st of [...STATIONS].sort((x, y) => y.freq - x.freq).filter(s => s.freq >= target.freq)) { // seek down the band, catching each channel
        const from = f;
        await tween(Math.max(180, (from - st.freq) * 60), t => { f = from + (st.freq - from) * ease(t); const fr = Math.round(f * 10) / 10, dd = Math.abs(fr - nearest(fr).freq);
          I.header = fr; I.f = fr; I.big = [{ text: fstr(fr), freq: true }]; I.sig = Math.max(1, Math.round(5 - dd * 4)); Sound.tune(dd); });
        f = st.freq;
        if (st === target) break;
        mark(st.id); I.name = { t: `${st.ps}  ${fmtF(st.freq)}`, b: .5 }; I.sig = 4; Sound.quiet(); Sound.blip(st); await tween(220); I.name = null;
      }
    }
    // lock: stereo, then the station name decodes from the RDS data
    Sound.quiet(); Sound.chime(target); mark(target.id);
    Object.assign(I, { label: null, locked: true, sig: 5, header: target.freq, f: H.scan ? null : target.freq });
    const text = home ? NAME : target.title, order = [...text].map(() => Math.random() * .85);
    const garble = (str, t) => [...str].map((ch, i) => ch === ' ' || t >= order[i] ? ch : JUNK[Math.floor(Math.random() * JUNK.length)]).join('');
    await tween(650, t => { if (home) I.label = garble(target.ps, t); else I.name = { t: garble(text, t), b: 1 }; });   // home: the PS name decodes in the header
    if (home) I.label = null; else I.name = { t: text, b: 1 };
    I.f = null; M.nf = target.freq;
    const fs = fstr(target.freq), first = H.first();
    await tween(450, t => { I.big = [{ text: fs, freq: true, p: 1 - t, seed: 1 }, ...(home ? [{ text: first, p: t, seed: 2 }] : [])]; });
    I.big = home ? null : [];
    if (H.bar !== false) for (let i = 1; i <= STATIONS.length; i++) { I.bar = i; Sound.click(.5); await tween(90); }
    if (home) { for (let i = 1; i <= 8; i++) { I.reveal = i; await tween(60); } if (H.onEnter) H.onEnter(); }
    S.painter = null; S.freq = target.freq; S.reveal = home || (isProj() && !S.sub) ? Infinity : 0; compose();   // the projects list is painted, not written line by line
    while (S.reveal < S.lines.length && !skipping) { S.reveal++; compose(); await wait(35); }
    S.reveal = Infinity; compose();
  }

  return {
    async start() {
      build(); const r = route(), target = r.st || byId('home');
      S.st = target; S.sub = r.sub; layout();     // a deep link seeks straight to its own channel
      S.painter = paintIntro;
      if (cfg.power === 'button') await standby();
      await seek(target);
      S.painter = null; S.freq = target.freq; S.reveal = Infinity; V.dirty = true; compose();
      renderState(S.st); sr.innerHTML = renderStation(S.st, S.sub);
    },
    onRoute() { const r = route(); tune(r.st || byId('home'), r.sub); },
  };
}

/* =====================================================================
   Variant switcher + boot
   ===================================================================== */
const VARIANTS = {
  stack:   ['Stack: title, then one quiet line of date, tags and reading time; one blank row between', { wl: 'stack' }],
  columns: ['Columns: one row per post, title left, date right, grouped under the year', { wl: 'columns' }],
  digest:  ['Digest: title with its date, then the summary; more air between posts', { wl: 'digest' }],
};
const NAMES = ['paged', 'scroll', 'full'];
const keyHandlers = []; const onKey = f => keyHandlers.push(f);
const params = new URLSearchParams(location.search);
const vKey = VARIANTS[params.get('variant')] ? params.get('variant') : 'stack';
if (!location.hash) history.replaceState(null, '', '#blog');   // this round is about the blog channel
const cfg = { k: .03, power: 'auto', fx: 'reception', name: NAMES.includes(params.get('name')) ? params.get('name') : 'paged',
  run: 'log', copy: 'oblique', hold: +params.get('hold') || 2500, pv: 'split', bv: 'wire', ...VARIANTS[vKey][1] };   // settled: split projects; log + oblique; ?hold=ms tunes how long the words stay   // settled: reception + paged name   // the curve is settled: subtle
if (params.has('k')) cfg.k = +params.get('k');                                              // tweak the curve: ?k=.045
if (params.get('power')) cfg.power = params.get('power');                                  // ?power=button|auto
function go(dir) {
  const ks = Object.keys(VARIANTS); const k = ks[(ks.indexOf(vKey) + dir + ks.length) % ks.length];
  for (const x of ['k', 'power']) params.delete(x);
  params.set('variant', k); location.href = location.pathname + '?' + params.toString() + location.hash;
}
function renderState(st) {
  const el = document.getElementById('pb-state'); if (!el) return;
  const r = route();
  el.textContent =  (st ? `${fmtF(st.freq)} ${st.ps}${r.sub ? '/' + r.sub : ''}` : 'intro') + (Sound.on ? ' · sound' : '');
}
if (params.get('bar') !== '0') {
  const bar = document.getElementById('proto-bar'); bar.hidden = false;
  document.getElementById('pb-label').textContent = `${vKey} (${VARIANTS[vKey][0]})`;
  document.getElementById('pb-prev').onclick = () => go(-1); document.getElementById('pb-next').onclick = () => go(1);
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (!e.metaKey && !e.ctrlKey && !['ArrowLeft', 'ArrowRight'].includes(e.key)) skipIntro();
  if (e.key === 'ArrowLeft') return go(-1);
  if (e.key === 'ArrowRight') return go(1);
  keyHandlers.forEach(f => f(e));
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#proto-bar')) skipIntro(); }, { capture: true });
const variant = Receiver(document.getElementById('app'), cfg);
renderState(null);
variant.start().then(() => { introActive = false; skipping = false; skipHooks.clear(); window.addEventListener('hashchange', () => variant.onRoute()); if (location.hash) variant.onRoute(); });
</script>
</body>
</html>
